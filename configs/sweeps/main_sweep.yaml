sweep_name: main_sweep
description: "5 backbones x 3 expansions x 4 K values = 60 TopK SAE runs"

backbones:
  - clip_vitb16
  - dinov2_vitb14
  - siglip_vitb16
  - mae_vitb16
  - deit_vitb16

architecture: batchtopk

expansion_factors:
  - 8
  - 16
  - 32

k_values:
  - 64
  - 128
  - 192
  - 256

# Training hyperparameters (applied to all runs)
training:
  lr: 1e-3
  batch_size: 8192
  num_epochs: 1
  seed: 42
